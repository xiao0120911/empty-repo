services:
  backend:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    environment:
      DATA_DIR: /app/data
    volumes:
      - agent_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  agent_data:
